# The core owns the service's business vocabulary and decision rules.
# It is deliberately I/O-free: no Redis, no Iggy, no HTTP clients, no runtime.
# Adding an I/O dependency here is a design violation, not a convenience.
[package]
name = "vela-relay-core"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.2.0", default-features = false, features = ["sol-types"] }
anyhow = "1"
crux_core = "0.19"
hex = "0.4"
hkdf = "0.12"
k256 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
